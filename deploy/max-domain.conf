# max.butskaya.ru -> bot_max.py (uvicorn 127.0.0.1:8000)
server {
    listen 80;
    listen [::]:80;
    server_name max.butskaya.ru;

    # health / wake
    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name max.butskaya.ru;

    ssl_certificate     /etc/letsencrypt/live/max.butskaya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max.butskaya.ru/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
